# The wrapper loads this file as a read-only PI_CONFIG_FILES overlay above the
# role's writable config.yml, so the role cannot change these keys.
# docs/adr/0002-role-homes.md says why each key other than modelRoles and retry
# is pinned; admin.ts check-config refuses a policy that misses one.
memory:
  backend: off
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  slow: opencode-go/deepseek-v4.1-flash:max
  advisor: openai-codex/gpt-6.1-sol:high
  plan: "@slow"
  task: openai-codex/gpt-6.1-sol:medium
  smol: opencode-go/deepseek-v4.1-flash:low
  commit: "@smol"
  tiny: opencode-go/deepseek-v4.1-flash:low
  memory: "@tiny"
  vision: openai-codex/gpt-6-luna:medium
  web: anthropic/claude-haiku-5-5:medium
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol:high
      - opencode-go/deepseek-v4.1-flash:max
      - lm-studio/qwen3.8-flash-next-ud-q4_k_xl
    slow:
      - lm-studio/qwen3.8-flash-next-ud-q4_k_xl
    advisor:
      - anthropic/claude-opus-5-5:high
      - opencode-go/deepseek-v4.1-flash:max
      - lm-studio/qwen3.8-flash-next-ud-q4_k_xl
    task:
      - opencode-go/deepseek-v4.1-flash:max
      - lm-studio/qwen3.8-flash-next-ud-q4_k_xl
    smol:
      - openai-codex/gpt-6-luna:medium
      - lm-studio/qwen3.8-flash-next-ud-q4_k_xl
    tiny:
      - opencode-go/mimo-v2.6-flash:low
      - lm-studio/qwen3.8-flash-next-ud-q4_k_xl
    vision:
      - anthropic/claude-haiku-5-5:medium
      - opencode-go/deepseek-v4.1-flash:max
memories:
  enabled: false
autolearn:
  enabled: false
  autoContinue: false
compaction:
  experimentalContextManagement: false
  handoffSaveToDisk: false
autoResume: false
plan:
  autosave: false
  autosaveDir: null
modelRoleStorage: global
startup:
  setupWizard: false
extensions: []
disabledExtensions: []
skills:
  enabled: true
  customDirectories: []
  ignoredSkills: []
  includeSkills: []
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: true
  enableAgentsProject: true
  enableClaudeUser: false
  enableClaudeProject: true
  enableCodexUser: false
commands:
  enableClaudeUser: false
  enableClaudeProject: true
  enableOpencodeUser: false
  enableOpencodeProject: true
mcp:
  enableProjectConfig: true
enabledProviders: []
disabledProviders: []
contextFiles:
  extra: []
workspace:
  additionalDirectories: []
task:
  disabledAgents: []
bash:
  direnv: auto
bashInterceptor:
  enabled: true
  patterns:
    - pattern: "^\\s*(?:(?:head|tail|less|more)\\s+|cat\\s+(?!\\s|(?:[02-9]>{1,2}\\|?\\s*[^\\s>|]\\S*\\s+)*(?:<<|1?>(?!&)|&>)))"
      tool: read
      message: "Use the `read` tool instead of cat/head/tail. It provides better context and handles binary files."
    - pattern: "^\\s*(grep|rg|ripgrep|ag|ack)\\s+"
      tool: grep
      message: "Use the `grep` tool instead of grep/rg. It respects .gitignore and provides structured output."
    - pattern: "^\\s*(find|fd|locate)\\s+.*(-name|-iname|-type|--type|-glob)"
      tool: glob
      message: "Use the `glob` tool instead of find/fd. It respects .gitignore and is faster for glob patterns."
    - pattern: "^\\s*sed\\s+(-i|--in-place)"
      tool: edit
      message: "Use the `edit` tool instead of sed -i. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*perl\\s+.*-[pn]?i"
      tool: edit
      message: "Use the `edit` tool instead of perl -i. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*awk\\s+.*-i\\s+inplace"
      tool: edit
      message: "Use the `edit` tool instead of awk -i inplace. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*(?:(?:echo|printf)\\s+|cat\\s*<<|cat(?=\\s+(?:\\d+|&)?>)\\s+)(?:(?:\\\\[\\s\\S]|\\$\\((?:[^()\"'`]|\"[^\"]*\"|'[^']*'|`[^`]*`|\\([^()]*\\))*\\)|\\$\\{[^{}]*\\}|`[^`]*`|\\$(?!\\((?:[^()\"'`]|\"[^\"]*\"|'[^']*'|`[^`]*`|\\([^()]*\\))*\\)|\\{[^{}]*\\})|`(?![^`]*`)|[^\"'>;&|\\n\\\\$`]|(?<=[<>])&|(?<![<>])&(?=>)|(?<=(?:^|\\s)[02-9])>{1,2}\\|?|\"[^\"]*\"|'[^']*')|(?<!\\||>|(?:^|\\s)[02-9])>{1,2}\\|?\\s*(?:\"/dev/(?:null|tty|stdout|stderr)\"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?=[\\s;&|]|$))*(?<!\\||>|(?:^|\\s)[02-9])>{1,2}\\|?\\s*(?!(?:\"/dev/(?:null|tty|stdout|stderr)\"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\\s;&|]|$))[$\\w./~\"'-]"
      tool: write
      message: "Use the `write` tool instead of echo/cat redirection. It handles encoding and provides confirmation. `write` replaces the whole file; to append to an existing file, use `edit` to insert after its last line."
    - pattern: "^\\s*nohup\\s+|(?<!&)\\&\\s*$"
      tool: bash
      message: "Use `bash` with `name` instead of nohup or background shell syntax so the service stays observable and managed."
    - pattern: "^\\s*(?:(?:bun|npm|pnpm|yarn)\\s+(?:run\\s+)?(?:dev|start)(?:\\s|$)|(?:vite|next\\s+dev|nuxt\\s+dev|nodemon|lldb|gdb|tail\\s+-f)(?:\\s|$)|docker\\s+compose\\s+up(?!.*(?:\\s-d(?:\\s|$)|--detach))(?:\\s|$))"
      tool: bash
      message: "Use `bash` with `name` for services, watchers, and debuggers; inspect with `read proc://<name>`."
    - pattern: "^\\s*(?:(?:bun|npm|pnpm|yarn)\\s+(?:run\\s+)?\\S+|cargo\\s+watch|watchexec|pytest|vitest|jest|tsc)(?:.|\\n)*(?:--watch|-w)(?:\\s|$)"
      tool: bash
      message: "Use `bash` with `name` for watch mode so its output, input, and lifecycle stay managed."
shellPath: null
shellCommandPrefix: null
shellMinimizer:
  settingsPath: null
python:
  interpreter: ""
ida:
  python: ""
  installDir: ""
images:
  urls:
    command: null
github:
  enabled: false
ttsr:
  builtinRules: true
  disabledRules: []
advisor:
  enabled: true
