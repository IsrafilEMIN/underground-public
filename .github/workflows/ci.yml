name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck libxml2-utils

      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          scripts=(host/bin/omp-arena host/bin/ug-setup host/bin/ug-auth host/bin/ug-backup host/bin/ug-box host/lib/raw-omp-config.bash scripts/probe-arena.sh scripts/probe-u1-u2.sh scripts/broker-github-app-wizard.sh)
          boxsh=(host/arena/init box/ug-init box/ug-holder box/ug-session)
          for f in "${scripts[@]}"; do
            bash -n "$f"
          done
          for f in "${boxsh[@]}"; do
            sh -n "$f"
          done
          shellcheck "${scripts[@]}"
          shellcheck -s sh "${boxsh[@]}"

      - name: Launchd plist XML
        run: xmllint --noout host/launchd/*.plist

      - name: Broker tests
        run: |
          set -euo pipefail
          if [ -d tests/broker ]; then
            node --test tests/broker/*.test.ts
          fi

      - name: Host tests
        run: |
          set -euo pipefail
          if [ -d tests/host ]; then
            node --test tests/host/*.test.ts
          fi
