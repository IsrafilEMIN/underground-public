name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck libxml2-utils

      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          bash_files=(); sh_files=()
          for f in host/bin/* host/lib/*.bash host/agent/* scripts/*.sh; do            case "$(head -n 1 "$f")" in
              '#!/usr/bin/env bash'*|'#!/bin/bash'*|'# shellcheck shell=bash'*) bash_files+=("$f") ;;
              '#!/bin/sh'*) sh_files+=("$f") ;;
            esac
          done
          for f in "${bash_files[@]}"; do bash -n "$f"; done
          for f in "${sh_files[@]}"; do sh -n "$f"; done
          shellcheck "${bash_files[@]}"
          if [ ${#sh_files[@]} -gt 0 ]; then shellcheck -s sh "${sh_files[@]}"; fi

      - name: Launchd plist XML
        run: xmllint --noout host/launchd/*.plist host/agent/*.plist

  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Broker and host tests
        run: |
          set -euo pipefail
          status=0
          node --test --test-reporter=tap tests/broker/*.test.ts tests/host/*.test.ts | tee tests.tap || status=$?
          if [ "$status" -ne 0 ]; then
            echo "failed tests:" >&2
            grep -E '^ *not ok ' tests.tap >&2 || true
            exit "$status"
          fi
          if grep -E '^ok [0-9]+ - \[mac\] .* # SKIP' tests.tap; then
            echo "a [mac] test skipped, so it checked nothing" >&2
            exit 1
          fi
