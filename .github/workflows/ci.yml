name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck libxml2-utils

      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          bash_files=(); sh_files=()
          for f in host/bin/* host/lib/*.bash host/agent/* scripts/*.sh; do            case "$(head -n 1 "$f")" in
              '#!/usr/bin/env bash'*|'#!/bin/bash'*|'# shellcheck shell=bash'*) bash_files+=("$f") ;;
              '#!/bin/sh'*) sh_files+=("$f") ;;
            esac
          done
          for f in "${bash_files[@]}"; do bash -n "$f"; done
          for f in "${sh_files[@]}"; do sh -n "$f"; done
          shellcheck "${bash_files[@]}"
          shellcheck -s sh "${sh_files[@]}"

      - name: Launchd plist XML
        run: xmllint --noout host/launchd/*.plist host/agent/*.plist
        
      - name: Broker tests
        run: |
          set -euo pipefail
          if [ -d tests/broker ]; then
            node --test tests/broker/*.test.ts
          fi

      - name: Host tests
        run: |
          set -euo pipefail
          if [ -d tests/host ]; then
            node --test tests/host/*.test.ts
          fi
